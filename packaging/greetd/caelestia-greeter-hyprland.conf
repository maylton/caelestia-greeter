monitor = ,preferred,auto,1

input {
    kb_layout = br
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
}

animations {
    enabled = false
}

decoration {
    rounding = 0

    blur {
        enabled = false
    }

    shadow {
        enabled = false
    }
}

exec-once = /usr/local/bin/caelestia-greeter-run
